<section>
  <div class="tasks-left">
    <span class="tasks-left-label">Tasks left</span>
    <span class="tasks-left-count">{{taskService.tasksLeft()}}</span>
  </div>

  @for (task of taskService.tasks(); track task.id) {
    <mat-card class="task-card"
              [class.todo]="task.status === 'TODO'"
              [class.in-progress]="task.status === 'IN_PROGRESS'"
              [class.completed]="task.status === 'COMPLETED'">
      <mat-card-content class="task-row">
        <div class="task-info">
          <a [routerLink]="['/tasks', task.id]">{{task.title}}</a>
          <span class="status">{{task.status}}</span>
        </div>
        @if (task.status === "IN_PROGRESS") {
          <button mat-raised-button class="btn btn-complete" (click)="taskService.complete(task.id)">Complete</button>
        } @else if (task.status === "TODO") {
          <button mat-raised-button class="btn btn-start" (click)="taskService.start(task.id)">Start</button>
        }
      </mat-card-content>
    </mat-card>
  }

  @if(taskService.errorMessage()) {
    <p>{{ taskService.errorMessage()}}</p>
  }

<!--  <a routerLink="/tasks/new">+ New Task</a>-->
  <button mat-mini-fab routerLink="/tasks/new">
    <mat-icon>add</mat-icon>
  </button>
</section>
