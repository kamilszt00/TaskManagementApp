<div class="form-card">
  <h1>Create new task</h1>

  <form [formGroup]="taskCreateForm" (ngSubmit)="onSubmit()">

    <mat-form-field class="field">
      <mat-label>Title of the task</mat-label>
      <input type="text" formControlName="title" matInput required/>
      @if (taskCreateForm.controls.title.touched && taskCreateForm.controls.title.hasError('required')) {
        <mat-error>Please add task title</mat-error>
      }
    </mat-form-field>


    <mat-form-field>
      <mat-label>Status</mat-label>
      <mat-select formControlName="status">
        <mat-option value="TODO">To do</mat-option>
        <mat-option value="IN_PROGRESS">In progress</mat-option>
        <mat-option value="COMPLETED">Completed</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Due date</mat-label>
      <input type="datetime-local" formControlName="dueDate" matInput required/>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Assignee ID</mat-label>
      <input type="number" formControlName="assigneeID" matInput required/>
    </mat-form-field>
    <mat-form-field>
        <mat-label>Project ID</mat-label>
        <input type="number" formControlName="projectID" matInput required/>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Tags IDs, e.g 1,2</mat-label>
      <input type="text" formControlName="tagsID" matInput required/>
    </mat-form-field>
    <button mat-flat-button [disabled]="!taskCreateForm.valid">Create task</button>
    <button mat-flat-button routerLink="/tasks">Cancel</button>
  </form>
</div>
