<div class="form-card">
  <h1>Create new task</h1>

  <form [formGroup]="taskCreateForm" (ngSubmit)="onSubmit()">
    <label class="field">
      <span>Title</span>
      <input type="text" formControlName="title" placeholder="Title of the task"/>
    </label>

    <label class="field">
      <span>Status</span>
      <select formControlName="status">
        <option value="TODO">To-do</option>
        <option value="IN_PROGRESS">In progress</option>
        <option value="COMPLETED">Completed</option>
      </select>
    </label>

    <label class="field">
      <span>Due date</span>
      <input type="datetime-local" formControlName="dueDate"/>
    </label>

    <label class="field">
      <span>Assignee ID</span>
      <input type="number" formControlName="assigneeID" placeholder="ID of the assignee"/>
    </label>

    <label class="field">
      <span>Project ID</span>
      <input type="number" formControlName="projectID" placeholder="ID of the project"/>
    </label>

    <label class="field">
      <span>Tags</span>
      <input type="text" formControlName="tagsID" placeholder="Tag IDs, e.g. 1,2"/>
    </label>

    <button type="submit" class="submit" [disabled]="!taskCreateForm.valid">Create task</button>
    <a class="cancel" routerLink="/tasks">Cancel</a>
  </form>
</div>
