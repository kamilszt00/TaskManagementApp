<header>
  <mat-toolbar>
    <mat-toolbar-row>
      <a class="logo-link" routerLink="/tasks" aria-label="TMapp home">
        <img class="logo" src="icons/mark.svg" alt="TMapp" />
      </a>
      <span class="spacer"></span>
      <button mat-button routerLink="/projects" routerLinkActive="active-link">My Projects</button>
      <button mat-button routerLink="/tasks" routerLinkActive="active-link">Task List</button>
      @if (authService.token()) {
        <button mat-icon-button (click)="logout()" aria-label="Logout">
          <mat-icon>logout</mat-icon>
        </button>
      }
    </mat-toolbar-row>
  </mat-toolbar>
</header>
<div class="page">
  <router-outlet />
</div>

<footer>
  <mat-toolbar>
    <mat-toolbar-row>
      <span> - v some version of app in footer</span>
    </mat-toolbar-row>
  </mat-toolbar>
</footer>
